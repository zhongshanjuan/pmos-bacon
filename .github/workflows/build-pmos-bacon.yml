# 一加一代（oneplus-bacon）在 GitHub Actions 上生成 postmarketOS 镜像
# 放到仓库的 .github/workflows/ 下即可。CI 只产出镜像文件，刷机仍需在本机用 fastboot。
name: build-pmos-bacon

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "界面：console / xfce4 / sway / phosh"
        type: string
        default: console
      extra_packages:
        description: "额外预装包（逗号分隔，留空则不装）"
        type: string
        default: "htop,tmux,vim,openssh"
      customize:
        description: "注入 bacon 定制（首启动调整 / 固件 / motd）；关掉则生成纯净镜像"
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC 重建一次（edge 是滚动的）

env:
  DEVICE: oneplus-bacon
  UI: ${{ inputs.ui || 'console' }}
  EXTRA: ${{ inputs.extra_packages || 'htop,tmux,vim,openssh' }}
  CUSTOMIZE: ${{ inputs.customize == false && '0' || '1' }}
  PMOS_APORTS: /home/runner/pmaports
  # 默认用上游 pmaports，不需要 fork。等你真要长期维护自己的补丁时，
  # 把这一行换成自己的 fork 即可（GitLab 或 GitHub 都行）：
  #   https://gitlab.postmarketos.org/<你的账号>/pmaports.git
  # 注意：2024-10 起 postmarketOS 已从 gitlab.com 整体迁到 gitlab.postmarketos.org，
  # 旧地址只剩一个「请去新地址」的提示仓库，clone 下来必然跑不起来。
  PMAPORTS_REPO: https://gitlab.postmarketos.org/postmarketOS/pmaports.git
  PMBOOTSTRAP_REPO: https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: 取仓库（bacon/ 下的定制脚本从这里来）
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          # 官方 runner 根分区只有 ~14G 可用，pmbootstrap 至少需要 10G+
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 python3-venv python3-pip git openssl zstd
          # armv7 的 initramfs 生成需要在 chroot 里跑目标架构二进制，必须有 binfmt + qemu-user
          sudo apt-get install -y -qq qemu-user-static binfmt-support \
            || sudo apt-get install -y -qq qemu-user-static
          ls /proc/sys/fs/binfmt_misc/ || true

      - name: 安装 pmbootstrap
        env:
          VENV: /home/runner/pmb-venv
        run: |
          set -euo pipefail

          # gitlab 偶尔会抽风，重试三次
          ok=0
          for i in 1 2 3; do
            rm -rf "$RUNNER_TEMP/pmbootstrap"
            if git clone --depth=1 "$PMBOOTSTRAP_REPO" "$RUNNER_TEMP/pmbootstrap"; then
              ok=1; break
            fi
            echo "::warning::clone pmbootstrap 失败（第 $i 次），5 秒后重试"
            sleep 5
          done
          # 旧地址（gitlab.com）clone 下来只剩一个迁移提示，pmb/ 目录不存在。
          # 这里必须拦住，否则会一路跑到 install 才炸，看不出原因。
          if [ "$ok" != 1 ] || [ ! -f "$RUNNER_TEMP/pmbootstrap/pmb/__init__.py" ]; then
            echo "::error::pmbootstrap 源码不对（$PMBOOTSTRAP_REPO）。确认仓库是否已迁移，当前目录内容："
            ls -la "$RUNNER_TEMP/pmbootstrap" || true
            exit 1
          fi

          python3 -m venv "$VENV"
          test -x "$VENV/bin/pip" || { echo "::error::venv 里没有 pip（缺 python3-venv？）"; exit 1; }
          "$VENV/bin/pip" install -q --upgrade pip setuptools wheel
          "$VENV/bin/pip" install -q -e "$RUNNER_TEMP/pmbootstrap"
          test -x "$VENV/bin/pmbootstrap" || { echo "::error::pmbootstrap 入口脚本没装上"; exit 1; }

          # 关键：GITHUB_PATH 只对「后续 step」生效，当前 step 必须用绝对路径。
          # 之前的失败就是这里：echo 到 GITHUB_PATH 之后紧接着裸调 pmbootstrap，得到 127（command not found）。
          echo "$VENV/bin" >> "$GITHUB_PATH"
          export PATH="$VENV/bin:$PATH"
          echo "PATH = $PATH"
          pmbootstrap --version

      - name: 缓存 apk 包（大幅度缩短二次构建时间）
        uses: actions/cache@v4
        with:
          path: /home/runner/.local/var/pmbootstrap/cache_apk_armv7
          key: apk-${{ env.DEVICE }}-${{ env.UI }}-${{ github.run_id }}
          restore-keys: |
            apk-${{ env.DEVICE }}-${{ env.UI }}-
            apk-${{ env.DEVICE }}-

      - name: 准备 pmaports 并做设备定制
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3; do
            rm -rf "$PMOS_APORTS"
            if git clone --filter=blob:none "$PMAPORTS_REPO" "$PMOS_APORTS"; then ok=1; break; fi
            echo "::warning::clone pmaports 失败（第 $i 次），10 秒后重试"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::pmaports 拉不下来"; exit 1; }
          echo "pmaports 来源: $PMAPORTS_REPO"
          git -C "$PMOS_APORTS" log -1 --oneline
          # 先看看上游到底有没有这个键，免得我们改的是一行本来就存在的东西
          grep -n 'create_initfs_extra' "$PMOS_APORTS"/device/*/device-"$DEVICE"/deviceinfo || true
          if [ "$CUSTOMIZE" = "1" ]; then
            chmod +x bacon/customize.sh
            ./bacon/customize.sh "$PMOS_APORTS"
          else
            echo "已关闭定制，使用纯净 pmaports"
          fi

      - name: 写配置并 init（非交互）
        run: |
          set -uo pipefail
          CFG="$HOME/.config/pmbootstrap_v3.cfg"
          mkdir -p "$(dirname "$CFG")"
          [ -n "${EXTRA:-}" ] || EXTRA=none

          # 新版 pmbootstrap 的 `init` 已经没有 --device/--ui 参数（只剩 --shallow-initial-clone），
          # 设备是 vendor → codename 两级提问。好在每一题的默认值都取自现有配置，
          # 所以先把目标值写进配置文件，再全部回车接受默认，比猜问题顺序靠谱得多。
          # 键名取自 pmb/core/config.py 的 Config 类。
          cat > "$CFG" <<EOF
          [pmbootstrap]
          aports = $PMOS_APORTS
          device = $DEVICE
          ui = $UI
          user = user
          hostname = bacon
          timezone = Asia/Shanghai
          extra_packages = $EXTRA
          ssh_keys = false
          sudo_timer = false
          EOF
          echo "==== 预置配置 $CFG ===="
          cat "$CFG"

          # channel 那题的默认值取自 pmaports 的 recommended，当前是 edge，
          # 而 edge 对应的分支就是 main，与我们 clone 的分支一致，不会触发切分支。
          #
          # 注意用「答案文件 + 重定向」而不是 `yes '' | pmbootstrap`：
          # 在 pipefail 下 yes 被 SIGPIPE 杀掉会让整条管道返回 141，
          # 把一次成功的 init 误判成失败。
          printf '\n%.0s' $(seq 1 300) > "$RUNNER_TEMP/answers.txt"
          if ! timeout 900 pmbootstrap --details-to-stdout init \
                < "$RUNNER_TEMP/answers.txt"; then
            echo "::error::pmbootstrap init 失败。版本与配置如下："
            pmbootstrap --version || true
            cat "$CFG" || true
            exit 1
          fi

          echo "==== 最终配置 ===="
          # timezone 那题的默认值取的是宿主机时区（runner 是 Etc/UTC），不读配置，
          # 所以 init 之后再定一次；失败也不致命（只是时区）。
          pmbootstrap config timezone Asia/Shanghai || true
          for k in device kernel ui user hostname timezone aports extra_packages; do
            echo "  $k = $(pmbootstrap config "$k" || echo '<无此键>')"
          done
          test "$(pmbootstrap config device)" = "$DEVICE" \
            || { echo "::error::device 没定下来，仍是 $(pmbootstrap config device)"; exit 1; }
          test "$(pmbootstrap config ui)" = "$UI" \
            || { echo "::error::ui 没定下来"; exit 1; }

      - name: 生成镜像
        run: |
          set -o pipefail
          # 全局参数（-y / --details-to-stdout）必须写在子命令 install 之前，
          # 否则 argparse 会报 unrecognized arguments（exit 2）。
          # --password 是给自动化用的明文占位密码（刷好后第一件事就是改掉）。
          pmbootstrap -y --details-to-stdout install --password 147147
          pmbootstrap shutdown || true

      - name: 导出镜像
        run: |
          pmbootstrap export
          mkdir -p out
          ls -l /tmp/postmarketOS-export/ || true
          # 工作目录里很多文件是 root 所有，统一复制出来
          sudo cp -L /tmp/postmarketOS-export/*.img out/ 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" out
          ls -lh out
          df -h /

      - name: 注入 bacon 定制（首启动调整 / 固件 / motd）
        if: env.CUSTOMIZE == '1'
        run: |
          chmod +x bacon/inject-tweaks.sh
          IMG=$(ls out/*.img | grep -v '/boot\.img$' | head -n1)
          [ -n "$IMG" ] || { echo "::error::没找到 rootfs 镜像"; exit 1; }
          sudo ./bacon/inject-tweaks.sh "$IMG"

      - name: 校验镜像（boot 分区只有 16MB，超了就是刷不进去）
        run: |
          BOOT=out/boot.img
          test -f "$BOOT" || { echo "::error::没有生成 boot.img"; exit 1; }
          SIZE=$(stat -c %s "$BOOT")
          LIMIT=$((16 * 1024 * 1024))
          echo "boot.img = $((SIZE / 1024)) KiB / 上限 16384 KiB"
          file out/*.img
          if [ "$SIZE" -ge "$LIMIT" ]; then
            echo "::error::boot.img 超过 16MB 分区上限，刷入后无法开机。在 deviceinfo 里加 deviceinfo_create_initfs_extra=true 后重跑，或换更小的内核。"
            exit 1
          elif [ "$SIZE" -gt $((LIMIT * 95 / 100)) ]; then
            echo "::warning::boot.img 已占用分区 95% 以上，后续内核更新会危险，建议精简 initramfs。"
          fi
          ( cd out && sha256sum *.img > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: 打印构建来源（出问题时方便回滚对比）
        run: |
          echo "pmbootstrap: $(pmbootstrap --version)"
          git -C "$PMOS_APORTS" rev-parse HEAD || true
          git -C "$PMOS_APORTS" log -1 --oneline || true
          git -C "$PMOS_APORTS" diff -- device || true

      - name: 上传镜像
        uses: actions/upload-artifact@v4
        with:
          name: pmos-bacon-${{ env.UI }}-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30
